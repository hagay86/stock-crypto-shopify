<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendScore-1000 ETF | $100B Live Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0B0E14;--bg2:#111520;--card:#161B26;--card2:#1A2030;
      --border:#1E2536;--border-l:#252D40;
      --blue:#4F8EF7;--blue-l:rgba(79,142,247,.12);--blue-d:#3A6ED8;
      --green:#00D68F;--green-l:rgba(0,214,143,.1);
      --red:#FF4D6A;--red-l:rgba(255,77,106,.1);
      --amber:#FFB547;--amber-l:rgba(255,181,71,.1);
      --purple:#A78BFA;--purple-l:rgba(167,139,250,.1);

    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t0);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

    .shell{display:flex;height:100vh}

    /* SIDEBAR */
    .side{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
    .side-hd{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .side-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;font-weight:900}
    .side-title{font-size:15px;font-weight:800}
    .side-sub{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.05em}
    .side-nav{padding:10px;overflow-y:auto;flex:1}
    .side-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 6px}
    .side-item{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;font-weight:500;color:var(--t1);border-radius:8px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .12s}
    .side-item:hover{background:var(--card)}
    .side-item.on{background:var(--blue-l);color:var(--blue);font-weight:600}
    .side-stat{margin-left:auto;font-size:11px;font-weight:700}
    .side-bottom{padding:12px;border-top:1px solid var(--border)}
    .side-user{display:flex;align-items:center;gap:10px;padding:8px 10px}
    .side-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700}
    .side-uname{font-size:13px;font-weight:600}
    .side-uplan{font-size:11px;color:var(--t3)}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
    .topbar h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
    .topbar p{font-size:12px;color:var(--t2);margin-top:2px}
    .live-badge{font-size:9px;font-weight:700;background:var(--green);color:#000;padding:2px 8px;border-radius:20px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .top-actions{display:flex;gap:8px}
    .tbtn{padding:7px 16px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .12s;border:1px solid var(--border);background:var(--card);color:var(--t1);display:flex;align-items:center;gap:5px}
    .tbtn:hover{border-color:var(--blue);color:var(--blue)}
    .tbtn.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border:none}
    .tbtn.primary:hover{opacity:.9}
    .content{flex:1;overflow-y:auto;padding:20px 24px}

    /* MEGA STATS */
    .mega-stats{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}
    .mega{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
    .mega.hero{border-color:var(--blue);background:linear-gradient(135deg,rgba(79,142,247,.08),rgba(167,139,250,.05))}
    .mega.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
    .mega-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .mega-val{font-size:22px;font-weight:900;line-height:1}
    .mega.hero .mega-val{font-size:28px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .mega-delta{font-size:11px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:3px}
    .up{color:var(--green)}.down{color:var(--red)}

    /* ETF CHART AREA */
    .etf-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
    .etf-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--cyan))}
    .chart-wrap{height:180px;border-radius:var(--radius);overflow:hidden}
    .chart-wrap canvas{width:100%!important;height:100%!important}

    /* GRID */
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
    .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
    .card-hd h3{font-size:13px;font-weight:700}
    .card-hd .badge{font-size:10px;font-weight:700;color:var(--blue);padding:2px 8px;background:var(--blue-l);border-radius:20px}
    .card-body{padding:0 16px 14px;max-height:400px;overflow-y:auto}

    /* HOLDINGS TABLE */
    .h-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .1s}
    .h-row:hover{background:var(--card2);margin:0 -16px;padding:7px 16px}
    .h-row:last-child{border:none}
    .h-rank{font-size:10px;font-weight:700;color:var(--t3);width:24px;text-align:center;flex-shrink:0}
    .h-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .h-info{flex:1;min-width:0}
    .h-sym{font-size:12px;font-weight:700;color:var(--t0)}
    .h-name{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .h-score{text-align:right;min-width:42px}
    .h-score-val{font-size:11px;font-weight:700;color:var(--blue)}
    .h-bar{height:3px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden;width:42px}
    .h-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
    .h-val{text-align:right;min-width:70px}
    .h-price{font-size:11px;font-weight:600}
    .h-chg{font-size:10px;font-weight:600}
    .h-weight{text-align:right;min-width:50px;font-size:11px;font-weight:700;color:var(--t2)}

    /* SECTOR BARS */
    .sector-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
    .sector-row:last-child{border:none}
    .sector-name{font-size:11px;font-weight:600;width:120px;flex-shrink:0;color:var(--t1)}
    .sector-bar{flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
    .sector-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px}
    .sector-pct{font-size:10px;font-weight:700;color:white;text-shadow:0 1px 2px rgba(0,0,0,.5)}
    .sector-val{font-size:10px;font-weight:600;color:var(--t3);width:85px;text-align:right;flex-shrink:0}

    /* TRADES LOG */
    .trade-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
    .trade-row:last-child{border:none}
    .trade-badge{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800;flex-shrink:0}
    .trade-buy{background:var(--green-l);color:var(--green)}
    .trade-sell{background:var(--red-l);color:var(--red)}
    .trade-init{background:var(--blue-l);color:var(--blue)}
    .trade-ticker{font-weight:700;width:50px;flex-shrink:0}
    .trade-detail{flex:1;color:var(--t2)}
    .trade-val{font-weight:700;text-align:right;min-width:80px}

    /* 3% RULE INDICATOR */
    .rule-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;border-left:3px solid var(--green)}
    .rule-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .rule-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
    .rule-active{font-size:10px;font-weight:700;background:var(--green-l);color:var(--green);padding:3px 10px;border-radius:20px}
    .rule-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .rule-stat{text-align:center;padding:8px;background:var(--bg);border-radius:8px}
    .rule-stat-val{font-size:16px;font-weight:800}
    .rule-stat-label{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-top:2px}

    /* SEARCH */
    .search-box{padding:6px 14px;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--t0);border-radius:8px;outline:none;width:220px;font-family:inherit;transition:border .12s}
    .search-box:focus{border-color:var(--blue)}
    .search-box::placeholder{color:var(--t3)}

    /* TABS */
    .tabs{display:flex;gap:2px;margin-bottom:12px}
    .tab{padding:6px 16px;font-size:12px;font-weight:600;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--t3);transition:all .12s}
    .tab:hover{color:var(--t1)}.tab.on{background:var(--blue);color:white}

    @media(max-width:1200px){.mega-stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:900px){.side{display:none}.mega-stats{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback, useMemo} = React;

/* ================================================================
   ETF STATE — Generated by etf_1000.py engine
   In production, this loads from etf_state.json via API
   For demo, we embed generated data inline
   ================================================================ */

  const topStocks = [
    {sym:'NVDA',name:'NVIDIA Corp.',sector:'TECH',price:892.50,score:82.3,chg:3.2,shares:2450000,tier:'mega'},
    {sym:'TSLA',name:'Tesla Inc.',sector:'CONS_D',price:268.40,score:78.1,chg:-1.4,shares:6800000,tier:'mega'},
    {sym:'PLTR',name:'Palantir Technologies',sector:'TECH',price:82.50,score:76.5,chg:5.1,shares:18000000,tier:'large'},
    {sym:'SMCI',name:'Super Micro Computer',sector:'TECH',price:845.20,score:75.8,chg:4.8,shares:1600000,tier:'mid'},
    {sym:'META',name:'Meta Platforms',sector:'COMM',price:592.30,score:74.2,chg:1.7,shares:2200000,tier:'mega'},
    {sym:'AVGO',name:'Broadcom Inc.',sector:'TECH',price:1420.80,score:73.5,chg:2.3,shares:850000,tier:'mega'},
    {sym:'ARM',name:'Arm Holdings plc',sector:'TECH',price:168.90,score:72.9,chg:3.8,shares:7200000,tier:'large'},
    {sym:'AAPL',name:'Apple Inc.',sector:'TECH',price:228.60,score:72.1,chg:0.8,shares:5300000,tier:'mega'},
    {sym:'MSFT',name:'Microsoft Corp.',sector:'TECH',price:435.20,score:71.8,chg:1.1,shares:2700000,tier:'mega'},
    {sym:'COIN',name:'Coinbase Global',sector:'FIN',price:265.40,score:71.2,chg:-2.1,shares:4200000,tier:'large'},
    {sym:'CRWD',name:'CrowdStrike Holdings',sector:'TECH',price:342.80,score:70.8,chg:2.9,shares:3100000,tier:'large'},
    {sym:'MSTR',name:'MicroStrategy',sector:'TECH',price:1780.50,score:70.3,chg:4.5,shares:580000,tier:'mid'},
    {sym:'AMD',name:'Advanced Micro Devices',sector:'TECH',price:178.90,score:69.7,chg:1.9,shares:5900000,tier:'large'},
    {sym:'AMZN',name:'Amazon.com Inc.',sector:'CONS_D',price:198.40,score:69.2,chg:0.6,shares:5100000,tier:'mega'},
    {sym:'GOOGL',name:'Alphabet Inc.',sector:'COMM',price:178.50,score:68.8,chg:0.3,shares:5600000,tier:'mega'},
    {sym:'APP',name:'AppLovin Corp.',sector:'TECH',price:315.20,score:68.4,chg:6.2,shares:3000000,tier:'large'},
    {sym:'LLY',name:'Eli Lilly',sector:'HEALTH',price:825.60,score:68.1,chg:1.5,shares:1300000,tier:'mega'},
    {sym:'IONQ',name:'IonQ Inc.',sector:'TECH',price:42.80,score:67.9,chg:-3.2,shares:22000000,tier:'growth'},
    {sym:'NFLX',name:'Netflix Inc.',sector:'COMM',price:895.20,score:67.5,chg:2.1,shares:1100000,tier:'mega'},
    {sym:'JPM',name:'JPMorgan Chase',sector:'FIN',price:245.80,score:67.2,chg:0.9,shares:3800000,tier:'mega'},
    {sym:'SNOW',name:'Snowflake Inc.',sector:'TECH',price:172.40,score:66.8,chg:-1.8,shares:5000000,tier:'large'},
    {sym:'MARA',name:'Marathon Digital',sector:'TECH',price:28.90,score:66.5,chg:7.1,shares:28000000,tier:'growth'},
    {sym:'DDOG',name:'Datadog Inc.',sector:'TECH',price:135.60,score:66.1,chg:2.4,shares:5800000,tier:'large'},
    {sym:'SHOP',name:'Shopify Inc.',sector:'TECH',price:98.50,score:65.8,chg:1.2,shares:8200000,tier:'large'},
    {sym:'V',name:'Visa Inc.',sector:'FIN',price:298.90,score:65.4,chg:0.5,shares:2800000,tier:'mega'},
    {sym:'UBER',name:'Uber Technologies',sector:'TECH',price:78.20,score:65.1,chg:1.8,shares:9500000,tier:'large'},
    {sym:'GE',name:'GE Aerospace',sector:'INDUST',price:198.40,score:64.7,chg:1.3,shares:3700000,tier:'mega'},
    {sym:'PANW',name:'Palo Alto Networks',sector:'TECH',price:365.80,score:64.3,chg:0.7,shares:2000000,tier:'large'},
    {sym:'SPOT',name:'Spotify Technology',sector:'COMM',price:562.40,score:63.9,chg:3.4,shares:1200000,tier:'large'},
    {sym:'UNH',name:'UnitedHealth Group',sector:'HEALTH',price:545.20,score:63.5,chg:-0.3,shares:1500000,tier:'mega'},
  ];

  // Generate the remaining ~970 stocks
  const allTickers = [
    // Already in top 30 above, plus hundreds more
    'ORCL','CRM','ADBE','INTC','CSCO','ACN','IBM','TXN','QCOM','INTU',
    'AMAT','ISRG','NOW','LRCX','MU','ADI','KLAC','SNPS','CDNS','MRVL',
    'FTNT','WDAY','NXPI','MCHP','ON','TEAM','ZS','NET','HUBS','DELL',
    'HPQ','HPE','DASH','ABNB','SQ','RBLX','TWLO','MDB','OKTA','TTD',
    'BAC','WFC','GS','MS','SPGI','BLK','C','SCHW','AXP','CB',
    'PGR','MMC','ICE','CME','AON','USB','PNC','COF','DFS','PYPL',
    'HOOD','SOFI','AFRM','BX','KKR','APO','MCO','MSCI','NDAQ',
    'UNH','JNJ','ABBV','MRK','PFE','TMO','ABT','DHR','AMGN','BMY',
    'GILD','MDT','SYK','ELV','CI','CVS','HCA','REGN','VRTX','BSX',
    'ZTS','DXCM','MRNA','BIIB','GEHC','MCK','COR','CRSP','HIMS',
    'HD','MCD','NKE','SBUX','LOW','TJX','BKNG','CMG','MAR','HLT',
    'ORLY','AZO','ROST','GM','F','RCL','LULU','ABNB','DKNG','RIVN',
    'PG','KO','PEP','COST','WMT','PM','MDLZ','CL','KMB','STZ',
    'DIS','CMCSA','T','VZ','TMUS','EA','TTWO','SNAP','PINS','RDDT',
    'CAT','RTX','UNP','HON','BA','LMT','UPS','DE','ADP','GD',
    'NOC','ITW','ETN','EMR','FDX','CSX','WM','TT','AXON','URI',
    'XOM','CVX','COP','SLB','OXY','DVN','FANG','KMI','WMB','CEG',
    'LIN','APD','SHW','FCX','NEM','ECL','DOW','NUE','GOLD',
    'PLD','AMT','CCI','EQIX','PSA','DLR','SPG','O','CBRE',
    'NEE','DUK','SO','AEP','VST','PCG','AES','NRG',
    'TSM','ASML','SAP','NVO','MELI','BABA','PDD','SE',
    'AI','SOUN','UPST','PATH','MNDY','DUOL','TOST',
    'RIOT','CLSK','BITF','HUT','ENPH','FSLR','RKLB','JOBY',
    'ANET','FICO','PLTR','DELL','SMCI',
  ].filter(t => !topStocks.find(s => s.sym === t));

  const sectorList = ['TECH','HEALTH','FIN','CONS_D','INDUST','ENERGY','MATER','COMM','CONS_S','REAL','UTIL'];
  const tiers = ['mega','large','mid','growth'];

  // Build full holdings
  let fullHoldings = [...topStocks];
  const totalToGenerate = 1000 - topStocks.length;

  for(let i = 0; i < totalToGenerate; i++) {
    const ticker = allTickers[i % allTickers.length] || `STK${String(i).padStart(3,'0')}`;
    const seed = ticker.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
    const sIdx = seed % sectorList.length;
    const tIdx = Math.min(3, Math.floor((i / totalToGenerate) * 4));
    const basePrice = [200,150,80,25][tIdx] * (0.5 + (seed % 100)/50);
    const score = Math.max(10, 65 - (i * 0.055) + (Math.sin(seed) * 8));
    const chg = (Math.sin(seed * 0.7) * 4);

    fullHoldings.push({
      sym: ticker,
      name: ticker + ' Corp.',
      sector: sectorList[sIdx],
      price: Math.round(basePrice * 100) / 100,
      score: Math.round(score * 10) / 10,
      chg: Math.round(chg * 100) / 100,
      shares: Math.round(TOTAL_CAPITAL * (score / 60000) / basePrice),
      tier: tiers[tIdx],
    });
  }

  // Sort by score
  fullHoldings.sort((a,b) => b.score - a.score);

  // Calculate weights
  const totalScore = fullHoldings.reduce((s,h) => s + Math.pow(h.score, 1.5), 0);
  fullHoldings = fullHoldings.map((h, i) => ({
    ...h,
    rank: i + 1,
    weight: Math.round((Math.pow(h.score, 1.5) / totalScore) * 10000) / 100,
    value: Math.round(h.shares * h.price),
    pnl: Math.round(h.chg * h.shares * h.price / 100),
  }));

  const totalValue = fullHoldings.reduce((s,h) => s + h.value, 0);
  const totalPnl = fullHoldings.reduce((s,h) => s + h.pnl, 0);

  return {
    holdings: fullHoldings,
    sectors,
    totalValue,
    totalPnl,
    totalPnlPct: (totalPnl / TOTAL_CAPITAL) * 100,
    totalPositions: fullHoldings.length,
    totalTrades: 4150,
    totalBuys: 2903,
    totalSells: 1247,
    cash: 75007,
  };
}

/* ====== PRICE ENGINE ====== */
function useLiveETF() {
  const [data, setData] = useState(() => generateETFData());
  const [etfHistory, setEtfHistory] = useState(() =>
    Array.from({length: 100}, (_, i) => {
      const base = 100;
      return Math.round((base + Math.sin(i * 0.12) * 2 + (i * 0.02) + (Math.random() - 0.48) * 0.5) * 100) / 100;
    })
  );
  const [tradeLog, setTradeLog] = useState([]);
  const [tick, setTick] = useState(0);

  useEffect(() => {
    const iv = setInterval(() => {
      setTick(t => t + 1);
      setData(prev => {
        let newTrades = [];
        const newHoldings = prev.holdings.map(h => {
          const vol = 0.0003 + Math.random() * 0.0006;
          const drift = (Math.random() - 0.497) * vol * h.price;
          const newPrice = Math.round((h.price + drift) * 100) / 100;
          const newChg = Math.round((((newPrice - h.price * (100 / (100 + h.chg))) / (h.price * (100 / (100 + h.chg)))) * 100) * 100) / 100 || h.chg + (drift / h.price * 100);

          // 3% rule check
          let newShares = h.shares;
          if (Math.abs(newChg) >= 3 && Math.random() < 0.02) {
            if (newChg <= -3) {
              const sellShares = Math.max(1, Math.floor(h.shares * 0.5));
              newShares = h.shares - sellShares;
              newTrades.push({
                action: 'SELL',
                ticker: h.sym,
                shares: sellShares,
                price: newPrice,
                value: sellShares * newPrice,
                reason: `3% DROP RULE — ${h.sym} down ${newChg.toFixed(1)}%`,
                time: new Date().toLocaleTimeString(),
              });
            } else if (newChg >= 3) {
              const buyShares = Math.max(1, Math.floor(h.shares * 0.5));
              newShares = h.shares + buyShares;
              newTrades.push({
                action: 'BUY',
                ticker: h.sym,
                shares: buyShares,
                price: newPrice,
                value: buyShares * newPrice,
                reason: `3% RISE RULE — ${h.sym} up +${newChg.toFixed(1)}%`,
                time: new Date().toLocaleTimeString(),
              });
            }
          }

          return {
            ...h,
            price: newPrice,
            chg: Math.round(newChg * 100) / 100,
            shares: newShares,
            value: Math.round(newShares * newPrice),
            pnl: Math.round(newChg * newShares * newPrice / 100),
            score: Math.max(5, Math.min(95, h.score + (Math.random() - 0.5) * 0.15)),
          };
        });

        if (newTrades.length > 0) {
          setTradeLog(prev => [...newTrades, ...prev].slice(0, 100));
        }

        const totalValue = newHoldings.reduce((s,h) => s + h.value, 0);
        const totalPnl = newHoldings.reduce((s,h) => s + h.pnl, 0);

        return {
          ...prev,
          holdings: newHoldings,
          totalValue,
          totalPnl,
          totalPnlPct: (totalPnl / 100000000000) * 100,
          totalTrades: prev.totalTrades + newTrades.length,
          totalBuys: prev.totalBuys + newTrades.filter(t => t.action === 'BUY').length,
          totalSells: prev.totalSells + newTrades.filter(t => t.action === 'SELL').length,
        };
      });

      setEtfHistory(prev => {
        const last = prev[prev.length - 1];
        const next = Math.round((last + (Math.random() - 0.498) * 0.15) * 100) / 100;
        return [...prev.slice(1), next];
      });
    }, 2000);
    return () => clearInterval(iv);
  }, []);

  return { data, etfHistory, tradeLog, tick };
}

/* ====== CHART ====== */
function Chart({history, height = 180}) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c || !history.length) return;
    const ctx = c.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const r = c.getBoundingClientRect();
    c.width = r.width * dpr; c.height = r.height * dpr;
    ctx.scale(dpr, dpr);
    const W = r.width, H = r.height;
    const min = Math.min(...history) * .9985, max = Math.max(...history) * 1.0015, rng = max - min || 1;
    const toX = i => (i / (history.length - 1)) * W, toY = v => H - ((v - min) / rng) * (H - 12) - 6;

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) { const y = 6 + (i / 3) * (H - 12); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    const isUp = history[history.length - 1] >= history[0];
    const lc = isUp ? '#00D68F' : '#FF4D6A';

    // Fill
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, isUp ? 'rgba(0,214,143,.15)' : 'rgba(255,77,106,.1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.moveTo(toX(0), toY(history[0]));
    for (let i = 1; i < history.length; i++) ctx.lineTo(toX(i), toY(history[i]));
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

    // Line
    ctx.beginPath(); ctx.moveTo(toX(0), toY(history[0]));
    for (let i = 1; i < history.length; i++) ctx.lineTo(toX(i), toY(history[i]));
    ctx.strokeStyle = lc; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

    // Dot
    const lx = toX(history.length - 1), ly = toY(history[history.length - 1]);
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fillStyle = lc; ctx.fill();
    ctx.beginPath(); ctx.arc(lx, ly, 8, 0, Math.PI * 2); ctx.fillStyle = isUp ? 'rgba(0,214,143,.2)' : 'rgba(255,77,106,.15)'; ctx.fill();
  }, [history]);
  return <canvas ref={ref} style={{width: '100%', height: '100%'}}/>;
}

/* ====== FORMATTING ====== */
function fmt(n) {
  if (Math.abs(n) >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (Math.abs(n) >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}

function fmtFull(n) {
  return '$' + n.toLocaleString(undefined, {maximumFractionDigits: 0});
}
